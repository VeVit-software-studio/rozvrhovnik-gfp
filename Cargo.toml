[package]
name = "rozvrhovnik"
version = "0.4.0"
edition = "2021"
description = "Generátor rozvrhů – Gymnázium Františka Palackého, Neratovice"
license = "MIT"

[lib]
name = "rozvrhovnik"
path = "src/lib.rs"

[[bin]]
name = "rozvrhovnik"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Nativní dialogy pro otevření/uložení souboru. Na Linuxu by rfd vyžadovalo GTK,
# proto se tam soubory ukládají do složky ./export a cesta se zadává textem.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = "0.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
